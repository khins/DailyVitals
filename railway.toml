[build]
builder = "RAILPACK"
buildCommand = "dotnet restore DailyVitals.slnx && dotnet publish DailyVitals.Web/DailyVitals.Web.csproj --configuration Release --output publish"

[deploy]
startCommand = "dotnet publish/DailyVitals.Web.dll"
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3